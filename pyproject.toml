[project]
name = "hushscript"
version = "0.1.0"
description = "Private, local interview transcription. Audio in memory, transcripts in your hands."
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "numpy>=2.0", "av>=14", "huggingface-hub>=0.30"]

[project.optional-dependencies]
benchmark = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
]

[dependency-groups]
browser = [
    "playwright>=1.63.0",
]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "jiwer>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
